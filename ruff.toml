# Ruff — Python linter config
# Docs: https://docs.astral.sh/ruff/

[lint]
# E/W = PEP8, F = pyflakes, N = naming
# Deliberately exclude I (isort) — import ordering is cosmetic for ROS 2 launch files
select = ["E", "W", "F", "N"]

ignore = [
    "E501",   # Line too long — MoveIt goal chains are naturally long
    "E402",   # Module import not at top — needed for sys.path hack before local imports
    "N803",   # Argument name uppercase — ROS params use CamelCase
    "N806",   # Variable uppercase — IK uses L1, L2, D
]

[lint.per-file-ignores]
"test/*.py" = ["F401"]  # Allow unused imports in test fixture files
