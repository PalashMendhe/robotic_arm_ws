# Pre-commit hooks — run automatically before every git commit
# Install once with: pip install pre-commit && pre-commit install
# Docs: https://pre-commit.com

repos:
  # Ruff: fast Python linter (replaces flake8 + isort + pyflakes)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # YAML lint: ensures all .yaml/.yml files are valid
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--config-file, .yamllint.yaml]

  # General hygiene: trailing whitespace, EOF newlines, large file guard
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-xml
      - id: check-added-large-files
        args: [--maxkb=500]
