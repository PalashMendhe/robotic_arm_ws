# kinematics_real.yaml
# Used by ur5_real.launch.py — real UR5 hardware.
# TracIK is more reliable than LMA for physical robots.
#
# TODO: Install TracIK before using this file:
#       sudo apt install ros-humble-trac-ik-kinematics-plugin

arm:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  solve_type: Speed   # Options: Speed | Distance | Manipulation1 | Manipulation2
